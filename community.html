<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Album | Malungelo Properties</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="album-page community-page">

<header id="navbar" class="subpage-topbar">
    <nav>
        <a href="index.html#life-at-malungelo" class="back-btn-nav">
            <i class="fas fa-arrow-left"></i> Back to Albums
        </a>
        <button id="theme-toggle" aria-label="Toggle light/dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </nav>
</header>

<main>
    <section class="album-hero">
        <div class="album-hero-content">
            <div class="section-label">Album 01</div>
            <h1>Community</h1>
            <p>The people, friendships, and shared moments that turn a residence into a home.</p>
        </div>
    </section>

    <section class="album-photo-section">
        <div class="section-label">Our Family</div>
        <h2 style="color: var(--gold); margin-bottom: 28px;">Community Gallery</h2>

        <div class="album-photo-grid gallery-container">
            <img src="community1.jpeg" alt="Malungelo community photo 1" loading="lazy">
            <img src="community2.jpeg" alt="Malungelo community photo 2" loading="lazy">
           
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>

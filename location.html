<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Album | Malungelo Properties</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="album-page location-page">

    <header id="navbar" class="subpage-topbar">
        <nav>
            <a href="index.html#life-at-malungelo" class="back-btn-nav">
                <i class="fas fa-arrow-left"></i> Back to Albums
            </a>

            <button id="theme-toggle" aria-label="Toggle light/dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </nav>
    </header>

    <main>

        <section class="album-hero">
            <div class="album-hero-content">
                <div class="section-label">Album 03</div>
                <h1>Location</h1>
                <p>
                    Gqeberha is your new neighbourhood  explore the views,
                    streets, and places close by.
                </p>
            </div>
        </section>

        <section class="album-photo-section">
            <div class="section-label">Explore Gqeberha</div>
            <h2 style="color: var(--gold); margin-bottom: 28px;">
                Places Around Malungelo Properties
            </h2>

            <!-- Click any image to zoom in -->
            <div class="album-photo-grid gallery-container">

                <img src="Location1.jpg" alt="Gqeberha location photo 1" loading="lazy">
                <img src="Location2.jpg" alt="Gqeberha location photo 2" loading="lazy">
                <img src="Location3.jpg" alt="Gqeberha location photo 3" loading="lazy">
                <img src="Location4.jpg" alt="Gqeberha location photo 4" loading="lazy">
                <img src="Location5.jpg" alt="Gqeberha location photo 5" loading="lazy">
                <img src="Location6.jpg" alt="Gqeberha location photo 6" loading="lazy">
                <img src="location.png" alt="Gqeberha location photo 7" loading="lazy">
                <img src="Location8.jpg" alt="Gqeberha location photo 8" loading="lazy">
                <img src="Location9.jpg" alt="Gqeberha location photo 9" loading="lazy">
                <img src="Location10.jpg" alt="Gqeberha location photo 10" loading="lazy">
                <img src="Location11.png" alt="Gqeberha location photo 11" loading="lazy">
                <img src="Location12.png" alt="Gqeberha location photo 12" loading="lazy">
               

            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

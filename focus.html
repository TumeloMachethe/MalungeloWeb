<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Album | Malungelo Properties</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="album-page focus-page">

<header id="navbar" class="subpage-topbar">
    <nav>
        <a href="index.html#life-at-malungelo" class="back-btn-nav">
            <i class="fas fa-arrow-left"></i> Back to Albums
        </a>
        <button id="theme-toggle" aria-label="Toggle light/dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </nav>
</header>

<main>
    <section class="album-hero">
        <div class="album-hero-content">
            <div class="section-label">Album 02</div>
            <h1>Focus</h1>
            <p>Study time, quiet routines, and the spaces that help students reach their goals.</p>
        </div>
    </section>

    <section class="album-photo-section">
        <div class="section-label">Student Success</div>
        <h2 style="color: var(--gold); margin-bottom: 28px;">Focus Gallery</h2>

        <div class="album-photo-grid gallery-container">
            <img src="focus1.png" alt="Student focus photo 1" loading="lazy">
            <img src="focus2.png" alt="Student focus photo 2" loading="lazy">
            <img src="focus3.png" alt="Student focus photo 3" loading="lazy">
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
